[project]
name = "nightshift"
version = "0.0.0"
description = "Development tooling for the nightshift Claude Code plugin"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hooks", "scripts", "templates"]
# Hooks and scripts are tested through their command lines, in subprocesses.
patch = ["subprocess"]
# The test process itself imports none of the measured code.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
show_missing = true

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The job names `check` and `e2e` are the required checks on `main`.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make e2e
